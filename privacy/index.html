const L={
ru:{h1:"Политика конфиденциальности",sub:"Приложение «Сафина» для iPhone",sum:"Сафина не собирает, не хранит на серверах и не передаёт ваши персональные данные. В приложении нет аккаунтов, рекламы, аналитики и отслеживания.",
s:[["Что хранится на устройстве","Настройки (город, язык, метод расчёта, марджа), отметки намазов, каза, цели, закладки и вставленные вами тексты хранятся только в памяти вашего iPhone. Разработчик их не видит. Они удаляются вместе с приложением."],
["Геопозиция","Доступ к геопозиции запрашивается, только когда вы нажимаете «Определить моё местоположение». Координаты используются на устройстве для расчёта времени намазов и киблы. Чтобы показать название места, iPhone обращается к системной службе Apple. Разработчику координаты не передаются."],
["Уведомления и отсчет до намаза","Уведомления об азане и напоминания (например, о дуа Кумайль) создаются и планируются на самом iPhone. Отсчет до намаза на экране блокировки и в Dynamic Island тоже считается на устройстве. Сервер для этого не используется."],
["Чтение Корана","Когда вы включаете чтеца, записи загружаются с сайта everyayah.com. Как и любой сайт, этот сервер получает технические данные запроса, например IP-адрес. Других данных о вас приложение туда не отправляет."],
["Покупки: Сафина+ и поддержка","Основные функции бесплатны. Подписка Сафина+ (месяц или год, с пробным периодом) и покупка навсегда открывают дополнительные функции. Подписка продлевается автоматически, отменить ее можно в настройках Apple ID. Добровольные платежи в поддержку ничего не открывают. Все оплаты проходят через App Store: платежные данные обрабатывает Apple, разработчик их не получает. Приложение только проверяет у Apple, активна ли подписка."],
["Внешние ссылки","Ссылки на сайты марджа и источников открываются в Safari. У этих сайтов свои правила конфиденциальности."],
["Дети","Приложение подходит для любого возраста и ни у кого не собирает персональные данные, в том числе у детей."],
["Изменения","Если правила изменятся, новая версия появится на этой странице с новой датой."]],
contact:"Связь с разработчиком",nomail:"Адрес для связи будет добавлен здесь.",upd:"Обновлено"},
en:{h1:"Privacy Policy",sub:"Safina app for iPhone",sum:"Safina does not collect, store on servers or share your personal data. The app has no accounts, ads, analytics or tracking.",
s:[["Data kept on your device","Settings (city, language, calculation method, marja), prayer marks, qada, goals, bookmarks and texts you paste are stored only on your iPhone. The developer cannot see them. They are deleted together with the app."],
["Location","Location access is requested only when you tap “Find my location”. The coordinates are used on the device to calculate prayer times and the qibla. To show the place name, the iPhone uses Apple's system service. The coordinates are not sent to the developer."],
["Notifications and prayer countdown","Azan notifications and reminders (for example, for Dua Kumayl) are created and scheduled on the iPhone itself. The prayer countdown on the Lock Screen and in the Dynamic Island is also calculated on the device. No server is used."],
["Quran recitation","When you play a reciter, the recordings are loaded from everyayah.com. Like any website, that server receives technical request data such as your IP address. The app sends it no other information about you."],
["Purchases: Safina+ and tips","The core features are free. The Safina+ subscription (monthly or yearly, with a free trial) and the lifetime purchase unlock extra features. The subscription renews automatically and can be cancelled in your Apple ID settings. Voluntary tips unlock nothing. All payments go through the App Store: payment details are handled by Apple and the developer does not receive them. The app only asks Apple whether the subscription is active."],
["External links","Links to marja and source websites open in Safari. Those websites have their own privacy rules."],
["Children","The app is suitable for all ages and collects no personal data from anyone, including children."],
["Changes","If this policy changes, the new version will appear on this page with a new date."]],
contact:"Contact the developer",nomail:"A contact address will be added here.",upd:"Last updated"},
az:{h1:"Məxfilik siyasəti",sub:"iPhone üçün «Səfinə» tətbiqi",sum:"Səfinə şəxsi məlumatlarınızı toplamır, serverlərdə saxlamır və heç kimə ötürmür. Tətbiqdə hesab, reklam, analitika və izləmə yoxdur.",
s:[["Cihazda saxlanılanlar","Parametrlər (şəhər, dil, hesablama üsulu, mərcə), namaz qeydləri, qəza, məqsədlər, əlfəcinlər və əlavə etdiyiniz mətnlər yalnız iPhone-unuzda saxlanılır. Tərtibatçı onları görmür. Tətbiqlə birlikdə silinir."],
["Məkan","Məkana giriş yalnız «Məkanımı müəyyən et» düyməsini basanda istənilir. Koordinatlar namaz vaxtlarını və qibləni hesablamaq üçün cihazda istifadə olunur. Yerin adını göstərmək üçün iPhone Apple-ın sistem xidmətinə müraciət edir. Koordinatlar tərtibatçıya göndərilmir."],
["Bildirişlər və namaza geri sayım","Azan bildirişləri və xatırlatmalar (məsələn, Kumeyl duası üçün) iPhone-un özündə yaradılır və planlaşdırılır. Kilid ekranında və Dynamic Island-da namaza geri sayım da cihazda hesablanır. Server istifadə olunmur."],
["Quran qiraəti","Qari qiraətini açanda yazılar everyayah.com saytından yüklənir. Hər sayt kimi bu server də sorğunun texniki məlumatlarını, məsələn IP ünvanını alır. Tətbiq ora sizin haqqınızda başqa məlumat göndərmir."],
["Alışlar: Səfinə+ və dəstək","Əsas funksiyalar pulsuzdur. Səfinə+ abunəliyi (aylıq və ya illik, sınaq müddəti ilə) və birdəfəlik alış əlavə funksiyaları açır. Abunəlik avtomatik yenilənir, onu Apple ID parametrlərində ləğv etmək olar. Könüllü dəstək ödənişləri heç nə açmır. Bütün ödənişlər App Store vasitəsilə keçir: ödəniş məlumatlarını Apple emal edir, tərtibatçı onları almır. Tətbiq yalnız Apple-dan abunəliyin aktiv olub-olmadığını yoxlayır."],
["Xarici keçidlər","Mərcə və mənbə saytlarına keçidlər Safari-də açılır. Bu saytların öz məxfilik qaydaları var."],
["Uşaqlar","Tətbiq bütün yaşlar üçün uyğundur və heç kimdən, o cümlədən uşaqlardan şəxsi məlumat toplamır."],
["Dəyişikliklər","Qaydalar dəyişsə, yeni versiya yeni tarixlə bu səhifədə görünəcək."]],
contact:"Tərtibatçı ilə əlaqə",nomail:"Əlaqə ünvanı burada əlavə olunacaq.",upd:"Yenilənib"},
fa:{h1:"سیاست حفظ حریم خصوصی",sub:"برنامهٔ «سفینه» برای آیفون",sum:"سفینه اطلاعات شخصی شما را جمع‌آوری نمی‌کند، روی سرور نگه نمی‌دارد و به کسی نمی‌دهد. برنامه حساب کاربری، تبلیغات، تحلیل آماری و ردیابی ندارد.",
s:[["آنچه روی دستگاه ذخیره می‌شود","تنظیمات (شهر، زبان، روش محاسبه، مرجع)، علامت نمازها، قضا، اهداف، نشانک‌ها و متن‌هایی که خودتان وارد می‌کنید فقط روی آیفون شما ذخیره می‌شوند. توسعه‌دهنده آن‌ها را نمی‌بیند. با حذف برنامه پاک می‌شوند."],
["موقعیت مکانی","دسترسی به موقعیت فقط وقتی درخواست می‌شود که «تعیین موقعیت من» را بزنید. مختصات روی دستگاه برای محاسبهٔ اوقات نماز و قبله به کار می‌رود. برای نمایش نام مکان، آیفون از سرویس سیستمی اپل استفاده می‌کند. مختصات برای توسعه‌دهنده ارسال نمی‌شود."],
["اعلان‌ها و شمارش معکوس نماز","اعلان‌های اذان و یادآوری‌ها (مثلاً برای دعای کمیل) روی خود آیفون ساخته و زمان‌بندی می‌شوند. شمارش معکوس نماز در صفحهٔ قفل و Dynamic Island هم روی دستگاه محاسبه می‌شود. از سرور استفاده نمی‌شود."],
["تلاوت قرآن","وقتی تلاوت قاری را پخش می‌کنید، فایل‌ها از سایت everyayah.com بارگیری می‌شوند. این سرور مانند هر سایتی اطلاعات فنی درخواست مانند نشانی IP را دریافت می‌کند. برنامه اطلاعات دیگری از شما به آنجا نمی‌فرستد."],
["خریدها: سفینه+ و حمایت","امکانات اصلی رایگان است. اشتراک سفینه+ (ماهانه یا سالانه، با دورهٔ آزمایشی) و خرید دائمی امکانات بیشتری را باز می‌کنند. اشتراک به‌طور خودکار تمدید می‌شود و می‌توانید آن را در تنظیمات Apple ID لغو کنید. پرداخت‌های داوطلبانهٔ حمایت چیزی را باز نمی‌کنند. همهٔ پرداخت‌ها از طریق App Store انجام می‌شود: اطلاعات پرداخت را اپل پردازش می‌کند و توسعه‌دهنده آن را دریافت نمی‌کند. برنامه فقط از اپل می‌پرسد که اشتراک فعال است یا نه."],
["پیوندهای بیرونی","پیوند سایت مراجع و منابع در Safari باز می‌شود. این سایت‌ها قوانین حریم خصوصی خود را دارند."],
["کودکان","برنامه برای همهٔ سنین مناسب است و از هیچ‌کس، از جمله کودکان، اطلاعات شخصی جمع نمی‌کند."],
["تغییرات","اگر این سیاست تغییر کند، نسخهٔ جدید با تاریخ جدید در همین صفحه منتشر می‌شود."]],
contact:"تماس با توسعه‌دهنده",nomail:"نشانی تماس به‌زودی اینجا افزوده می‌شود.",upd:"به‌روزرسانی"},
ar:{h1:"سياسة الخصوصية",sub:"تطبيق «سفينة» لأجهزة iPhone",sum:"لا يجمع تطبيق سفينة بياناتك الشخصية ولا يخزّنها على خوادم ولا يشاركها مع أحد. لا يوجد في التطبيق حسابات ولا إعلانات ولا تحليلات ولا تتبّع.",
s:[["ما يُحفظ على جهازك","الإعدادات (المدينة واللغة وطريقة الحساب والمرجع) وعلامات الصلوات والقضاء والأهداف والإشارات المرجعية والنصوص التي تضيفها تُحفظ على جهاز iPhone فقط. لا يطّلع عليها المطوّر، وتُحذف مع حذف التطبيق."],
["الموقع","يُطلب الوصول إلى الموقع فقط عند الضغط على «تحديد موقعي». تُستخدم الإحداثيات على الجهاز لحساب أوقات الصلاة والقبلة. ولعرض اسم المكان يستعين iPhone بخدمة النظام من Apple. لا تُرسل الإحداثيات إلى المطوّر."],
["الإشعارات والعد التنازلي للصلاة","تُنشأ إشعارات الأذان والتذكيرات (مثل دعاء كميل) وتُجدول على جهاز iPhone نفسه. ويُحسب العد التنازلي للصلاة على شاشة القفل وفي Dynamic Island على الجهاز أيضًا. لا يُستخدم أي خادم."],
["تلاوة القرآن","عند تشغيل تلاوة قارئ تُحمَّل التسجيلات من موقع everyayah.com. وكأي موقع، يتلقى هذا الخادم بيانات الطلب التقنية مثل عنوان IP. ولا يرسل التطبيق إليه أي معلومات أخرى عنك."],
["المشتريات: سفينة+ والدعم","الميزات الأساسية مجانية. يفتح اشتراك سفينة+ (شهري أو سنوي مع فترة تجريبية) والشراء مدى الحياة ميزات إضافية. يتجدد الاشتراك تلقائيًا ويمكن إلغاؤه من إعدادات Apple ID. لا تفتح مدفوعات الدعم الطوعية أي ميزة. تتم جميع المدفوعات عبر App Store: تعالج Apple بيانات الدفع ولا يتلقاها المطوّر. يتحقق التطبيق من Apple فقط مما إذا كان الاشتراك نشطًا."],
["الروابط الخارجية","تُفتح روابط مواقع المراجع والمصادر في Safari، ولهذه المواقع قواعد الخصوصية الخاصة بها."],
["الأطفال","التطبيق مناسب لجميع الأعمار ولا يجمع بيانات شخصية من أحد، بمن فيهم الأطفال."],
["التغييرات","إذا تغيّرت هذه السياسة فستظهر النسخة الجديدة في هذه الصفحة بتاريخ جديد."]],
contact:"التواصل مع المطوّر",nomail:"سيُضاف عنوان التواصل هنا.",upd:"آخر تحديث"},
ur:{h1:"رازداری کی پالیسی",sub:"آئی فون کے لیے «سفینہ» ایپ",sum:"سفینہ آپ کا ذاتی ڈیٹا جمع نہیں کرتی، سرورز پر محفوظ نہیں کرتی اور کسی کو نہیں دیتی۔ ایپ میں کوئی اکاؤنٹ، اشتہار، اینالیٹکس یا ٹریکنگ نہیں ہے۔",
s:[["آپ کے آلے پر محفوظ ڈیٹا","ترتیبات (شہر، زبان، حساب کا طریقہ، مرجع)، نمازوں کے نشانات، قضا، اہداف، بک مارکس اور آپ کے شامل کیے ہوئے متن صرف آپ کے آئی فون پر محفوظ ہوتے ہیں۔ ڈویلپر انہیں نہیں دیکھ سکتا۔ ایپ حذف کرنے پر یہ بھی حذف ہو جاتے ہیں۔"],
["مقام","مقام تک رسائی صرف اس وقت مانگی جاتی ہے جب آپ «میرا مقام استعمال کریں» دباتے ہیں۔ کوآرڈینیٹس آلے پر ہی نماز کے اوقات اور قبلہ کے حساب کے لیے استعمال ہوتے ہیں۔ جگہ کا نام دکھانے کے لیے آئی فون Apple کی سسٹم سروس استعمال کرتا ہے۔ کوآرڈینیٹس ڈویلپر کو نہیں بھیجے جاتے۔"],

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function show(l){const t=L[l]||L.ru;const rtl=l==="fa"||l==="ar"||l==="ur";
  document.documentElement.lang=l;document.documentElement.dir=rtl?"rtl":"ltr";
  document.getElementById("h1").textContent=t.h1;document.getElementById("sub").textContent=t.sub;document.getElementById("sum").textContent=t.sum;
  document.getElementById("body").innerHTML=t.s.map(([h,p])=>`<section><h2>${esc(h)}</h2><p>${esc(p)}</p></section>`).join("")+
    `<section><h2>${esc(t.contact)}</h2><p>${CONTACT?`<span class="mail">${esc(CONTACT)}</span>`:esc(t.nomail)}</p></section>`;
  document.getElementById("meta").textContent=`${t.upd}: ${UPDATED[l]}`;
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===l)));
  try{localStorage.setItem("safina.privacy.lang",l)}catch(e){}}
document.getElementById("langs").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.l)};
let start="ru";const h=(location.hash||"").slice(1);
if(L[h])start=h;else{try{const s=localStorage.getItem("safina.privacy.lang");if(L[s])start=s;else{const n=(navigator.language||"ru").slice(0,2);if(L[n])start=n}}catch(e){}}
show(start);
</script>
